- job-template:
    name: percona-server-{ps_version}-pipeline-parallel-mtr
    project-type: pipeline
    description: |
        <b>Do not make changes to the pipeline definition via the web interface!<br>
        (Do not use 'Configure' option on the left for changing the pipeline definition)<br>
        Change <a href="{scripts_repo}/tree/{scripts_branch}/jenkins/pipeline-parallel-mtr.yml">pipeline-parallel-mtr.yml</a>
           and <a href="{scripts_repo}/tree/{scripts_branch}/jenkins/pipeline-parallel-mtr.groovy">pipeline-parallel-mtr.groovy</a>
        in the <a href="{scripts_repo}/tree/{scripts_branch}/jenkins">git repo</a> instead.</b><br>
        Then update pipeline with "jenkins-jobs --server ps80.cd update jenkins/pipeline-parallel-mtr.yml".
    concurrent: true
    pipeline-scm:
      scm:
        - git:
            url: "{scripts_repo}"
            branches:
            - "{scripts_branch}"
            wipe-workspace: false
      lightweight-checkout: true
      script-path: jenkins/pipeline-parallel-mtr.groovy
    parameters:
    - string:
        name: BUILD_NUMBER_BINARIES
        default: ""
        description: Reuse binaries built in the specified build. Useful for quick MTR test rerun without rebuild.
    - string:
        name: GIT_REPO
        default: "https://github.com/percona/percona-server"
        description: URL to percona-server repository
    - string:
        name: BRANCH
        default: "{branch_name}"
        description: Tag/Branch/Commit for percona-server repository
    - string:
        name: CUSTOM_BUILD_NAME
        default: ""
        description: Custom string that will be appended to the build name visible in Jenkins
    - bool:
        name: USE_PR
        default: false
        description: "Check only if you pass PR number to BRANCH field"
    - choice:
        name: DOCKER_OS
        choices: '{docker_os_list}'
        description: OS version for compilation
    - choice:
        name: ARCH
        choices:
        - "x86_64"
        - "aarch64"
        description: CPU architecture for compilation
    - choice:
        name: CMAKE_BUILD_TYPE
        choices:
        - Debug
        - RelWithDebInfo
        description: Type of build to produce
    - choice:
        name: JOB_CMAKE
        choices:
        - /usr/bin/cmake
        description: path to cmake binary
    - string:
        name: COMPILER
        description: compiler version e.g. gcc-15 or clang-20 or use default system compiler if empty
    - choice:
        name: ANALYZER_OPTS
        choices: '{sanitizer_opts_list}'
        description: Enable code checking
    - choice:
        name: WITH_ROCKSDB
        choices:
        - "ON"
        - "OFF"
        description: Compile RocksDB engine
    - choice:
        name: WITH_ROUTER
        choices:
        - "ON"
        - "OFF"
        description: Whether to build MySQL Router
    - choice:
        name: WITH_MYSQLX
        choices:
        - "ON"
        - "OFF"
        description: Whether to build with support for X Plugin
    - choice:
        name: WITH_JS_LANG
        choices:
        - "OFF"
        - "ON"
        description: Whether to build JS Stored Programs component
    - string:
        name: CMAKE_OPTS
        default:
        description: cmake options
    - string:
        name: MAKE_OPTS
        default:
        description: make options, like VERBOSE=1
    - choice:
        name: USE_CCACHE
        choices:
        - "yes"
        - "no"
        default: "yes"
        description: Use ccache to speed up compilation (80-90% faster rebuilds)
    - choice:
        name: CI_FS_MTR
        choices:
        - "yes"
        - "no"
        description: Run case-insensetive MTR tests
    - choice:
        name: WITH_PS_PROTOCOL
        choices:
        - "yes"
        - "no"
        description: Run MTR tests with --ps-protocol
    - string:
        name: MTR_ARGS
        default: '{mtr_opts}'
        description: "mysql-test-run.pl options, for options like: --big-test --only-big-test --nounit-tests --unit-tests-report"
    - string:
        name: MTR_REPEAT
        default: "1"
        description: Run each test N number of times, --repeat=N
    - choice:
        name: KEYRING_VAULT_MTR
        choices:
        - "no"
        - "yes"
        description: Run mtr --suite=component_keyring_vault or --suite=keyring_vault for 8.0
    - string:
        name: KEYRING_VAULT_V1_VERSION
        default: "0.9.6"
        description: Specifies version of Hashicorp Vault for V1 tests
    - string:
        name: KEYRING_VAULT_V2_VERSION
        default: "1.9.0"
        description: Specifies version of Hashicorp Vault for V2 tests
    - choice:
        name: CLOUD
        choices:
        - "auto"
        - "Hetzner"
        - "AWS"
        - "epyc9654"
        description: "Host provider for Jenkins workers.<BR><B>auto</B> - uses Hetzner for x86_64 and aarch64, with AWS fallback for aarch64 when Hetzner ARM capacity is unavailable."
    - choice:
        name: FULL_MTR
        choices:
        - "yes"
        - "no"
        - "skip_mtr"
        description: |
            yes - full MTR<br>
            no - run mtr suites based on variables WORKER_N_MTR_SUITES<br>
            skip_mtr - skip testing phase. Only build.
    - choice:
        name: EXECUTE_SUITES_ONE_BY_ONE
        choices:
        - "no"
        - "yes"
        description: Run each MTR suite separately or run MTR tests merged into 2 groups (normal and big tests) for each worker
    - string:
        name: WORKER_1_MTR_SUITES
        default: ""
        description: "Suites to be ran on worker 1 when FULL_MTR is no. Unit tests, if requested, can be ran here only!"
    - string:
        name: WORKER_2_MTR_SUITES
        default: ""
        description: "Suites to be ran on worker 2 when FULL_MTR is no"
    - string:
        name: WORKER_3_MTR_SUITES
        default: ""
        description: "Suites to be ran on worker 3 when FULL_MTR is no"
    - string:
        name: WORKER_4_MTR_SUITES
        default: ""
        description: "Suites to be ran on worker 4 when FULL_MTR is no"
    - string:
        name: WORKER_5_MTR_SUITES
        default: ""
        description: "Suites to be ran on worker 5 when FULL_MTR is no"
    - string:
        name: WORKER_6_MTR_SUITES
        default: ""
        description: "Suites to be ran on worker 6 when FULL_MTR is no"
    - string:
        name: WORKER_7_MTR_SUITES
        default: ""
        description: "Suites to be ran on worker 7 when FULL_MTR is no"
    - string:
        name: WORKER_8_MTR_SUITES
        default: ""
        description: "Suites to be ran on worker 8 when FULL_MTR is no"
    - string:
        name: MTR_STANDALONE_TESTS
        default:
        description: "Space-separated test names to be executed. Worker 1 handles this request."
    - string:
        name: MTR_STANDALONE_TESTS_PARALLEL
        default: 1
        description: "MTR workers count for standalone tests"
    - bool:
        name: ALLOW_ABORTED_WORKERS_RERUN
        default: false
        description: "Rerun aborted workers"
    - string:
        name: SLACK_CHANNEL
        default: '#ps-upstream-merges'
        description: Slack channel
    - string:
        name: JENKINS_SCRIPTS_REPO
        default: '{scripts_repo}'
        description: Download the build scripts from this repository, except for the Groovy script referenced by the path defined in pipeline-parallel-mtr.yml
    - string:
        name: JENKINS_SCRIPTS_BRANCH
        default: '{scripts_branch}'
    - hidden:
        name: LAUNCHER_USER_ID
        default: ''
        description: Internal parameter, do not modify
    - hidden:
        name: PIPELINE_NAME
        default: 'percona-server-{ps_version}-pipeline-parallel-mtr'
        description: 'Internal pipeline name (hidden)'

- project:
    name: pipeline-parallel-mtr-8.0
    ps_version: 8.0
    branch_name: '8.0'
    mtr_opts: --unit-tests-report --mem --big-test
    scripts_repo: https://github.com/Percona-Lab/ps-build
    scripts_branch: '8.0'
    docker_os_list:
      - oraclelinux:8
      - oraclelinux:9
      - oraclelinux:10
      - ubuntu:jammy
      - ubuntu:noble
      - ubuntu:resolute
      - debian:bullseye
      - debian:bookworm
      - debian:trixie
    sanitizer_opts_list:
      -
    jobs:
      - percona-server-{ps_version}-pipeline-parallel-mtr

