- job-template:
    name: percona-server-{ps_version}-param-parallel-mtr
    project-type: matrix
    defaults: global
    description: |
        <h3 style="color:Red;"><b>Are you sure you need to run this job?</b></h3><br>
        It will create multiple pipelines which create multiple workers.<br>
        Maybe just a single pipeline run is enough?<br>
        <b>Do not make changes to the pipeline definition via the web interface!<br>
        (Do not use 'Configure' option on the left for changing the pipeline definition)<br>
        Change <a href="{scripts_repo}/tree/{scripts_branch}/jenkins/param-57-parallel-mtr.yml">param-57-parallel-mtr.yml</a>
        in the <a href="{scripts_repo}/tree/{scripts_branch}/jenkins">git repo</a> instead.</b><br>
        Then update pipeline with "jenkins-jobs --server ps57.cd update jenkins/param-57-parallel-mtr.yml".
    disabled: false
    concurrent: true
    auth-token: psparam80
    node: micro-amazon
    properties:
    - build-discarder:
        days-to-keep: -1
        num-to-keep: 50
        artifact-days-to-keep: -1
        artifact-num-to-keep: 50
    parameters:
    - matrix-combinations:
        name: COMBINATIONS
        description: "Select matrix combinations"
        filter: CMAKE_BUILD_TYPE=="Debug" && DOCKER_OS=="debian:buster" || CMAKE_BUILD_TYPE=="RelWithDebInfo" && DOCKER_OS=="debian:buster" || CMAKE_BUILD_TYPE=="Debug" && DOCKER_OS=="oraclelinux:9" || CMAKE_BUILD_TYPE=="RelWithDebInfo" && DOCKER_OS=="oraclelinux:9" || CMAKE_BUILD_TYPE=="Debug" && DOCKER_OS=="centos:7" || CMAKE_BUILD_TYPE=="RelWithDebInfo" && DOCKER_OS=="centos:7" || CMAKE_BUILD_TYPE=="Debug" && DOCKER_OS=="centos:8" || CMAKE_BUILD_TYPE=="RelWithDebInfo" && DOCKER_OS=="centos:8" || CMAKE_BUILD_TYPE=="Debug" && DOCKER_OS=="ubuntu:focal" || CMAKE_BUILD_TYPE=="RelWithDebInfo" && DOCKER_OS=="ubuntu:focal" || CMAKE_BUILD_TYPE=="Debug" && DOCKER_OS=="ubuntu:jammy" || CMAKE_BUILD_TYPE=="RelWithDebInfo" && DOCKER_OS=="ubuntu:jammy"
    - string:
        name: GIT_REPO
        default: "https://github.com/percona/mysql-5.7-post-eol"
        description: URL to the 5.7 repository
    - string:
        name: BRANCH
        default: "{branch_name}"
        description: Tag/Branch for the 5.7 repository
    - string:
        name: CUSTOM_BUILD_NAME
        default: ""
        description: Custom string that will be appended to the build name visible in Jenkins
    - bool:
        name: USE_PR
        default: false
        description: "Check only if you pass PR number to BRANCH field"
    - choice:
        name: JOB_CMAKE
        choices:
        - /usr/bin/cmake
        description: path to cmake binary
    - string:
        name: COMPILER
        description: compiler version e.g. gcc-15 or clang-20 or use default system compiler if empty
    - choice:
        name: ANALYZER_OPTS
        choices:
        -
        - -DWITH_ASAN=ON -DWITH_ASAN_SCOPE=ON
        - -DWITH_ASAN=ON
        - -DWITH_ASAN=ON -DWITH_ASAN_SCOPE=ON -DWITH_UBSAN=ON
        - -DWITH_ASAN=ON -DWITH_UBSAN=ON
        - -DWITH_UBSAN=ON
        - -DWITH_MSAN=ON
        - -DWITH_VALGRIND=ON
        description: Enable code checking
    - choice:
        name: WITH_ROCKSDB
        choices:
        - "ON"
        - "OFF"
        description: Compile RocksDB engine
    - choice:
        name: WITH_ROUTER
        choices:
        - "ON"
        - "OFF"
        description: Whether to build MySQL Router
    - choice:
        name: WITH_MYSQLX
        choices:
        - "ON"
        - "OFF"
        description: Whether to build with support for X Plugin
    - string:
        name: CMAKE_OPTS
        default:
        description: cmake options
    - string:
        name: MAKE_OPTS
        default:
        description: make options
    - choice:
        name: USE_CCACHE
        choices:
        - "yes"
        - "no"
        default: "yes"
        description: Use ccache to speed up compilation (80-90% faster rebuilds)
    - choice:
        name: CI_FS_MTR
        choices:
        - "yes"
        - "no"
        description: Run case-insensetive MTR tests
    - string:
        name: MTR_ARGS
        default: --unit-tests-report --mem --big-test
        description: "mysql-test-run.pl options, for options like: --big-test --only-big-test --nounit-tests --unit-tests-report"
    - string:
        name: MTR_REPEAT
        default: "1"
        description: Run each test N number of times, --repeat=N
    - choice:
        name: KEYRING_VAULT_MTR
        choices:
        - "no"
        - "yes"
        description: Run mtr --suite=component_keyring_vault or --suite=keyring_vault for 8.0
    - string:
        name: KEYRING_VAULT_V1_VERSION
        default: "0.9.6"
        description: Specifies version of Hashicorp Vault for V1 tests
    - string:
        name: KEYRING_VAULT_V2_VERSION
        default: "1.9.0"
        description: Specifies version of Hashicorp Vault for V2 tests
    - choice:
        name: CLOUD
        choices:
        - "Hetzner"
        - "AWS"
        - "epyc9654"
        description: "Host provider for Jenkins workers"
    - choice:
        name: FULL_MTR
        choices:
        - "yes"
        - "no"
        - "skip_mtr"
        description: |
            yes - full MTR<br>
            no - run mtr suites based on variables WORKER_N_MTR_SUITES<br>
            skip_mtr - skip testing phase. Only build.
    - choice:
        name: EXECUTE_SUITES_ONE_BY_ONE
        choices:
        - "yes"
        - "no"
        description: Run each MTR suite separately or run MTR tests merged into 2 groups (normal and big tests) for each worker
    - string:
        name: WORKER_1_MTR_SUITES
        default: ""
        description: "Suites to be ran on worker 1 when FULL_MTR is no. Unit tests, if requested, can be ran here only!"
    - string:
        name: WORKER_2_MTR_SUITES
        default: ""
        description: "Suites to be ran on worker 2 when FULL_MTR is no"
    - string:
        name: WORKER_3_MTR_SUITES
        default: ""
        description: "Suites to be ran on worker 3 when FULL_MTR is no"
    - string:
        name: WORKER_4_MTR_SUITES
        default: ""
        description: "Suites to be ran on worker 4 when FULL_MTR is no"
    - string:
        name: WORKER_5_MTR_SUITES
        default: ""
        description: "Suites to be ran on worker 5 when FULL_MTR is no"
    - string:
        name: WORKER_6_MTR_SUITES
        default: ""
        description: "Suites to be ran on worker 6 when FULL_MTR is no"
    - string:
        name: WORKER_7_MTR_SUITES
        default: ""
        description: "Suites to be ran on worker 7 when FULL_MTR is no"
    - string:
        name: WORKER_8_MTR_SUITES
        default: ""
        description: "Suites to be ran on worker 8 when FULL_MTR is no"
    - string:
        name: MTR_STANDALONE_TESTS
        default:
        description: "Space-separated test names to be executed. Worker 1 handles this request."
    - string:
        name: MTR_STANDALONE_TESTS_PARALLEL
        default: 1
        description: "MTR workers count for standalone tests"
    - bool:
        name: ALLOW_ABORTED_WORKERS_RERUN
        default: false
        description: "Rerun aborted workers"
    - string:
        name: SLACK_CHANNEL
        default: '#ps-upstream-merges'
        description: Slack channel for messages when a job was finished
    - string:
        name: JENKINS_SCRIPTS_REPO
        default: '{scripts_repo}'
        description: Download the build scripts from this repository, except for the Groovy script referenced by the path defined in pipeline-parallel-mtr.yml
    - string:
        name: JENKINS_SCRIPTS_BRANCH
        default: '{scripts_branch}'
    axes:
      - axis:
         type: user-defined
         name: CMAKE_BUILD_TYPE
         values:
          - RelWithDebInfo
          - Debug
      - axis:
         type: user-defined
         name: DOCKER_OS
         values: '{docker_os_list}'
    wrappers:
      - build-user-vars  # Ensures BUILD_USER_ID is available
    builders:
    - trigger-builds:
      - project: percona-server-{ps_version}-pipeline-parallel-mtr
        current-parameters: true
        predefined-parameters: |
          DOCKER_OS=${{DOCKER_OS}}
          ARCH=x86_64
          CMAKE_BUILD_TYPE=${{CMAKE_BUILD_TYPE}}
          LAUNCHER_USER_ID=$BUILD_USER_ID
        block: true
        block-thresholds:
          build-step-failure-threshold: FAILURE
          unstable-threshold: never
          failure-threshold: FAILURE
    - shell: |
        whoami
        ls -l
        sudo find . \( -name "*.xml" -o -name "*.log" \) -delete || echo "sudo cleanup skipped"
        find . \( -name "*.xml" -o -name "*.log" \) -delete || echo "cleanup skipped"
    - copyartifact:
        project: percona-server-{ps_version}-pipeline-parallel-mtr
        which-build: specific-build
        build-number: "${{TRIGGERED_BUILD_NUMBERS_percona_server_{ps_version_no_dot}_pipeline_parallel_mtr}}"
        do-not-fingerprint: true
    - shell: |
        echo "${{TRIGGERED_BUILD_NUMBERS_percona_server_{ps_version_no_dot}_pipeline_parallel_mtr}}" > PIPELINE_BUILD_NUMBER
        gunzip build.log.gz
    publishers:
    - junit:
        results: "**/*.xml"
        keep-long-stdio: true
    - archive:
        artifacts: 'PIPELINE_BUILD_NUMBER'

- project:
    name: param-parallel-mtr-5.7
    ps_version: 5.7
    ps_version_no_dot: '5_7'
    branch_name: 5.7
    scripts_repo: https://github.com/Percona-Lab/ps-build
    scripts_branch: 8.0
    docker_os_list:
      - centos:7
      - centos:8
      - oraclelinux:8
      - oraclelinux:9
      - ubuntu:bionic
      - ubuntu:focal
      - ubuntu:jammy
      - debian:buster
      - debian:bullseye
      - debian:bookworm
    jobs:
      - percona-server-{ps_version}-param-parallel-mtr
