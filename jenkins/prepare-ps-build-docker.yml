- job:
    name: prepare-ps-build-docker
    project-type: pipeline
    description: |
        Prepare docker images for PS builds.
        upload to public.ecr.aws/e7j3v3n0/ps-build
        Do not edit this job through the web!
    disabled: false
    concurrent: false
    pipeline-scm:
      scm:
        - git:
            url: https://github.com/Percona-Lab/ps-build.git
            branches:
            - '8.0'
            wipe-workspace: false
      lightweight-checkout: true
      script-path: jenkins/prepare-ps-build-docker.groovy
    properties:
    - build-discarder:
        days-to-keep: -1
        num-to-keep: 10
        artifact-days-to-keep: -1
        artifact-num-to-keep: 10
    parameters:
    - choice:
        name: ARCH
        choices:
        - "x86_64"
        - "aarch64"
        description: CPU architecture for images
