- job-template:
    name: percona-server-{ps_version}-pipeline-dynamic
    project-type: pipeline
    description: |
        <b>Do not make changes to the pipeline definition via the web interface!<br>
        (Do not use 'Configure' option on the left for changing the pipeline definition)<br>
        Change <a href="{scripts_repo}/tree/{scripts_branch}/jenkins/pipeline-dynamic.yml">pipeline-dynamic.yml</a>
           and <a href="{scripts_repo}/tree/{scripts_branch}/jenkins/pipeline-dynamic.groovy">pipeline-dynamic.groovy</a>
        in the <a href="{scripts_repo}/tree/{scripts_branch}/jenkins">git repo</a> instead.</b><br>
        Then update pipeline with "jenkins-jobs --server ps80.cd update jenkins/pipeline-dynamic.yml".<br>
        <br>
        This is the <b>dynamic work-queue</b> variant of pipeline-parallel-mtr: instead of a
        hand-tuned static split, the full suite list is held in a single queue and N workers
        pull one suite at a time until the queue is empty.
    concurrent: true
    pipeline-scm:
      scm:
        - git:
            url: "{scripts_repo}"
            branches:
            - "{scripts_branch}"
            wipe-workspace: false
      lightweight-checkout: true
      script-path: jenkins/pipeline-dynamic.groovy
    parameters:
    - string:
        name: BUILD_NUMBER_BINARIES
        default: ""
        description: Reuse binaries built in the specified build. Useful for quick MTR test rerun without rebuild.
    - string:
        name: GIT_REPO
        default: "https://github.com/percona/percona-server"
        description: |
            Repository to build/test. Other repositories (copy into the field as needed):<br>
            https://github.com/percona/percona-server<br>
            https://github.com/percona/percona-server-private<br>
            https://github.com/percona/mysql-eol-dev<br>
            https://github.com/percona/mysql-5.7-post-eol<br>
            https://github.com/mysql/mysql-server
    - string:
        name: BRANCH
        default: "{branch_name}"
        description: Tag/Branch/Commit for percona-server repository
    - string:
        name: CUSTOM_BUILD_NAME
        default: ""
        description: Custom string that will be appended to the build name visible in Jenkins
    - bool:
        name: USE_PR
        default: false
        description: "Check only if you pass PR number to BRANCH field"
    - choice:
        name: DOCKER_OS
        choices: '{docker_os_list}'
        description: OS version for compilation
    - choice:
        name: ARCH
        choices:
        - "x86_64"
        - "aarch64"
        description: CPU architecture for compilation
    - choice:
        name: CMAKE_BUILD_TYPE
        choices:
        - Debug
        - RelWithDebInfo
        description: Type of build to produce
    - choice:
        name: JOB_CMAKE
        choices:
        - /usr/bin/cmake
        description: path to cmake binary
    - string:
        name: COMPILER
        description: compiler version e.g. gcc-15 or clang-20 or use default system compiler if empty
    - choice:
        name: ANALYZER_OPTS
        choices: '{sanitizer_opts_list}'
        description: Enable code checking
    - choice:
        name: WITH_ROCKSDB
        choices:
        - "ON"
        - "OFF"
        description: Compile RocksDB engine
    - choice:
        name: WITH_ROUTER
        choices:
        - "ON"
        - "OFF"
        description: Whether to build MySQL Router
    - choice:
        name: WITH_MYSQLX
        choices:
        - "ON"
        - "OFF"
        description: Whether to build with support for X Plugin
    - choice:
        name: WITH_JS_LANG
        choices:
        - "OFF"
        - "ON"
        description: Whether to build JS Stored Programs component
    - string:
        name: CMAKE_OPTS
        default:
        description: cmake options
    - string:
        name: MAKE_OPTS
        default:
        description: make options, like VERBOSE=1
    - choice:
        name: USE_CCACHE
        choices:
        - "yes"
        - "no"
        default: "yes"
        description: Use ccache to speed up compilation (80-90% faster rebuilds)
    - choice:
        name: CI_FS_MTR
        choices:
        - "yes"
        - "no"
        description: Run case-insensetive MTR tests (handled by the primary worker)
    - choice:
        name: WITH_PS_PROTOCOL
        choices:
        - "yes"
        - "no"
        description: Run MTR tests with --ps-protocol (handled by the primary worker)
    - string:
        name: MTR_ARGS
        default: '{mtr_opts}'
        description: "mysql-test-run.pl options, for options like: --big-test --only-big-test --nounit-tests --unit-tests-report"
    - string:
        name: MTR_REPEAT
        default: "1"
        description: Run each test N number of times, --repeat=N
    - choice:
        name: KEYRING_VAULT_MTR
        choices:
        - "no"
        - "yes"
        description: Run mtr --suite=component_keyring_vault or --suite=keyring_vault for 8.0 (handled by the primary worker)
    - string:
        name: KEYRING_VAULT_V1_VERSION
        default: "0.9.6"
        description: Specifies version of Hashicorp Vault for V1 tests
    - string:
        name: KEYRING_VAULT_V2_VERSION
        default: "1.9.0"
        description: Specifies version of Hashicorp Vault for V2 tests
    - choice:
        name: KEYRING_KMIP_MTR
        choices:
        - "no"
        - "yes"
        description: Run mtr --suite=component_keyring_kmip (handled as its own decoupled special worker)
    - choice:
        name: CLOUD
        choices:
        - "auto"
        - "Hetzner"
        - "AWS"
        - "epyc9654"
        description: "Host provider for Jenkins workers.<BR><B>auto</B> - uses Hetzner for x86_64 and aarch64, with AWS fallback for aarch64 when Hetzner ARM capacity is unavailable."
    - choice:
        name: FULL_MTR
        choices:
        - "yes"
        - "no"
        - "skip_mtr"
        description: |
            yes - full MTR; the suite queue is built from mysql-test-run.pl DEFAULT_SUITES<br>
            no - run only the suites listed in RERUN_MTR_SUITES (manual run / aborted-suite rerun)<br>
            skip_mtr - skip testing phase. Only build.
    - string:
        name: MTR_NUM_WORKERS
        default: "8"
        description: "Number of worker agents that pull suites from the shared queue in parallel."
    - string:
        name: RERUN_MTR_SUITES
        default: ""
        description: "Comma-separated suites to load into the queue when FULL_MTR=no (manual run or aborted-suite rerun)."
    - bool:
        name: RESUME
        default: false
        description: |
            Resume an interrupted run (e.g. after a controller restart that could not auto-resume).<br>
            Set together with BUILD_NUMBER_BINARIES=&lt;the interrupted build&gt;: suites that already
            passed in that build (recorded to S3 as checkpoints) are skipped, and only the
            remaining + previously-failed suites are run.
    - string:
        name: MTR_STANDALONE_TESTS
        default:
        description: "Space-separated test names to be executed. The primary worker handles this request."
    - bool:
        name: ALLOW_ABORTED_WORKERS_RERUN
        default: false
        description: "Re-submit a follow-up build for suites/specials that failed or were aborted"
    - string:
        name: SLACK_CHANNEL
        default: '#ps-upstream-merges'
        description: Slack channel
    - string:
        name: JENKINS_SCRIPTS_REPO
        default: '{scripts_repo}'
        description: Download the build scripts from this repository, except for the Groovy script referenced by the path defined in pipeline-dynamic.yml
    - string:
        name: JENKINS_SCRIPTS_BRANCH
        default: '{scripts_branch}'
    - hidden:
        name: LAUNCHER_USER_ID
        default: ''
        description: Internal parameter, do not modify
    - hidden:
        name: PIPELINE_NAME
        default: 'percona-server-{ps_version}-pipeline-dynamic'
        description: 'Internal pipeline name (hidden)'

- project:
    name: pipeline-dynamic-28.4
    ps_version: 28.4
    branch_name: 'release-26.7.0-1'
    mtr_opts: --unit-tests-report --mem --big-test
    scripts_repo: https://github.com/Percona-Lab/ps-build
    scripts_branch: '8.0'
    docker_os_list:
      - ubuntu:resolute
      - oraclelinux:8
      - oraclelinux:9
      - oraclelinux:10
      - ubuntu:jammy
      - ubuntu:noble
      - debian:bookworm
      - debian:trixie
    sanitizer_opts_list:
      -
    jobs:
      - percona-server-{ps_version}-pipeline-dynamic

# ----------------------- VALGRIND --------------------------------

- project:
    name: pipeline-dynamic-28.4-VALGRIND
    ps_version: 28.4-VALGRIND
    branch_name: 'release-26.7.0-1'
    mtr_opts: --unit-tests-report --big-test --retry-failure=0
    scripts_repo: https://github.com/Percona-Lab/ps-build
    scripts_branch: '8.0'
    docker_os_list:
      - ubuntu:resolute
    sanitizer_opts_list:
      - -DWITH_VALGRIND=ON
    jobs:
      - percona-server-{ps_version}-pipeline-dynamic

# ----------------------- ASAN --------------------------------

- project:
    name: pipeline-dynamic-28.4-ASAN
    ps_version: 28.4-ASAN
    branch_name: 'release-26.7.0-1'
    mtr_opts: --unit-tests-report --big-test --retry-failure=0
    scripts_repo: https://github.com/Percona-Lab/ps-build
    scripts_branch: '8.0'
    docker_os_list:
      - ubuntu:resolute
      - ubuntu:noble
      - debian:bookworm
    sanitizer_opts_list:
      - -DWITH_ASAN=ON -DWITH_ASAN_SCOPE=ON
      - -DWITH_ASAN=ON
      - -DWITH_ASAN=ON -DWITH_ASAN_SCOPE=ON -DWITH_UBSAN=ON
      - -DWITH_ASAN=ON -DWITH_UBSAN=ON
      - -DWITH_UBSAN=ON
      - -DWITH_MSAN=ON
    jobs:
      - percona-server-{ps_version}-pipeline-dynamic

