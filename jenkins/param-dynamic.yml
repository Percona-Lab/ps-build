- job-template:
    name: percona-server-{ps_version}-param-dynamic
    project-type: matrix
    defaults: global
    description: |
        <h3 style="color:Red;"><b>Are you sure you need to run this job?</b></h3><br>
        It will create multiple pipelines which create multiple workers.<br>
        Maybe just a single pipeline run is enough?<br>
        <b>Do not make changes to the pipeline definition via the web interface!<br>
        (Do not use 'Configure' option on the left for changing the pipeline definition)<br>
        Change <a href="{scripts_repo}/tree/{scripts_branch}/jenkins/param-dynamic.yml">param-dynamic.yml</a>
        in the <a href="{scripts_repo}/tree/{scripts_branch}/jenkins">git repo</a> instead.</b><br>
        Then update pipeline with "jenkins-jobs --server ps80.cd update jenkins/param-dynamic.yml".<br>
        <br>
        Matrix launcher for the <b>dynamic work-queue</b> pipeline
        (percona-server-{ps_version}-pipeline-dynamic), the counterpart of
        the percona-server-*-param-parallel-mtr launchers for the static split.
    disabled: false
    concurrent: true
    auth-token: psparam80
    node: micro-amazon
    properties:
    - build-discarder:
        days-to-keep: -1
        num-to-keep: 50
        artifact-days-to-keep: -1
        artifact-num-to-keep: 50
    parameters:
    - matrix-combinations:
        name: COMBINATIONS
        description: "Select matrix combinations"
        filter: CMAKE_BUILD_TYPE=="Debug" && DOCKER_OS=="ubuntu:noble" && ARCH=="x86_64" || CMAKE_BUILD_TYPE=="RelWithDebInfo" && DOCKER_OS=="ubuntu:noble" && ARCH=="x86_64" || CMAKE_BUILD_TYPE=="Debug" && DOCKER_OS=="ubuntu:resolute" && ARCH=="x86_64" || CMAKE_BUILD_TYPE=="RelWithDebInfo" && DOCKER_OS=="ubuntu:resolute" && ARCH=="x86_64" || CMAKE_BUILD_TYPE=="Debug" && DOCKER_OS=="debian:bookworm" && ARCH=="x86_64" || CMAKE_BUILD_TYPE=="RelWithDebInfo" && DOCKER_OS=="debian:bookworm" && ARCH=="x86_64" || CMAKE_BUILD_TYPE=="Debug" && DOCKER_OS=="debian:trixie" && ARCH=="x86_64" || CMAKE_BUILD_TYPE=="RelWithDebInfo" && DOCKER_OS=="debian:trixie" && ARCH=="x86_64" || CMAKE_BUILD_TYPE=="Debug" && DOCKER_OS=="oraclelinux:9" && ARCH=="x86_64" || CMAKE_BUILD_TYPE=="RelWithDebInfo" && DOCKER_OS=="oraclelinux:9" && ARCH=="x86_64" || CMAKE_BUILD_TYPE=="Debug" && DOCKER_OS=="oraclelinux:10" && ARCH=="x86_64" || CMAKE_BUILD_TYPE=="RelWithDebInfo" && DOCKER_OS=="oraclelinux:10" && ARCH=="x86_64"
    - string:
        name: GIT_REPO
        default: "https://github.com/percona/percona-server"
        description: URL to percona-server repository
    - string:
        name: BRANCH
        default: "{branch_name}"
        description: Tag/Branch for percona-server repository
    - string:
        name: CUSTOM_BUILD_NAME
        default: ""
        description: Custom string that will be appended to the build name visible in Jenkins
    - bool:
        name: USE_PR
        default: false
        description: "Check only if you pass PR number to BRANCH field"
    - choice:
        name: JOB_CMAKE
        choices:
        - /usr/bin/cmake
        description: path to cmake binary
    - string:
        name: COMPILER
        description: compiler version e.g. gcc-15 or clang-20 or use default system compiler if empty
    - choice:
        name: ANALYZER_OPTS
        choices:
        -
        description: Sanitizer builds run from the {ps_version}-ASAN and {ps_version}-VALGRIND jobs
    - choice:
        name: WITH_ROCKSDB
        choices:
        - "ON"
        - "OFF"
        description: Compile RocksDB engine
    - choice:
        name: WITH_ROUTER
        choices:
        - "ON"
        - "OFF"
        description: Whether to build MySQL Router
    - choice:
        name: WITH_MYSQLX
        choices:
        - "ON"
        - "OFF"
        description: Whether to build with support for X Plugin
    - choice:
        name: WITH_JS_LANG
        choices:
        - "OFF"
        - "ON"
        description: Whether to build JS Stored Programs component
    - string:
        name: CMAKE_OPTS
        default:
        description: cmake options
    - string:
        name: MAKE_OPTS
        default:
        description: make options
    - choice:
        name: USE_CCACHE
        choices:
        - "yes"
        - "no"
        default: "yes"
        description: Use ccache to speed up compilation (80-90% faster rebuilds)
    - choice:
        name: CI_FS_MTR
        choices:
        - "yes"
        - "no"
        description: Run case-insensetive MTR tests
    - choice:
        name: WITH_PS_PROTOCOL
        choices:
        - "yes"
        - "no"
        description: Run MTR tests with --ps-protocol
    - string:
        name: MTR_ARGS
        default: --unit-tests-report --mem --big-test
        description: "mysql-test-run.pl options, for options like: --big-test --only-big-test --nounit-tests --unit-tests-report"
    - string:
        name: MTR_REPEAT
        default: "1"
        description: Run each test N number of times, --repeat=N
    - choice:
        name: KEYRING_VAULT_MTR
        choices:
        - "no"
        - "yes"
        description: Run mtr --suite=component_keyring_vault or --suite=keyring_vault for 8.0
    - string:
        name: KEYRING_VAULT_V1_VERSION
        default: "0.9.6"
        description: Specifies version of Hashicorp Vault for V1 tests
    - string:
        name: KEYRING_VAULT_V2_VERSION
        default: "1.9.0"
        description: Specifies version of Hashicorp Vault for V2 tests
    - choice:
        name: CLOUD
        choices:
        - "auto"
        - "Hetzner"
        - "AWS"
        - "epyc9654"
        description: "Host provider for Jenkins workers.<BR><B>auto</B> - uses Hetzner for x86_64 and aarch64, with AWS fallback for aarch64 when Hetzner ARM capacity is unavailable."
    - choice:
        name: FULL_MTR
        choices:
        - "yes"
        - "no"
        - "skip_mtr"
        description: |
            yes - full MTR; the suite queue is built from mysql-test-run.pl DEFAULT_SUITES<br>
            no - run only the suites listed in RERUN_MTR_SUITES (manual run / aborted-suite rerun)<br>
            skip_mtr - skip testing phase. Only build.
    - string:
        name: MTR_NUM_WORKERS
        default: "8"
        description: "Number of worker agents that pull suites from the shared queue in parallel."
    - string:
        name: RERUN_MTR_SUITES
        default: ""
        description: "Comma-separated suites to load into the queue when FULL_MTR=no (manual run or aborted-suite rerun)."
    - string:
        name: MTR_STANDALONE_TESTS
        default:
        description: "Space-separated test names to be executed. The primary worker handles this request."
    - bool:
        name: ALLOW_ABORTED_WORKERS_RERUN
        default: false
        description: "Re-submit a follow-up build for suites/specials that failed or were aborted"
    - string:
        name: SLACK_CHANNEL
        default: '#ps-upstream-merges'
        description: Slack channel for messages when a job was finished
    - string:
        name: JENKINS_SCRIPTS_REPO
        default: '{scripts_repo}'
        description: Download the build scripts from this repository, except for the Groovy script referenced by the path defined in pipeline-dynamic.yml
    - string:
        name: JENKINS_SCRIPTS_BRANCH
        default: '{scripts_branch}'
    axes:
      - axis:
         type: user-defined
         name: CMAKE_BUILD_TYPE
         values:
          - RelWithDebInfo
          - Debug
      - axis:
         type: user-defined
         name: DOCKER_OS
         values: '{docker_os_list}'
      - axis:
         type: user-defined
         name: ARCH
         values:
          - "x86_64"
          - "aarch64"
    wrappers:
      - build-user-vars  # Ensures BUILD_USER_ID is available
    builders:
    - trigger-builds:
      - project: percona-server-{ps_version}-pipeline-dynamic
        current-parameters: true
        predefined-parameters: |
          DOCKER_OS=${{DOCKER_OS}}
          ARCH=${{ARCH}}
          CMAKE_BUILD_TYPE=${{CMAKE_BUILD_TYPE}}
          LAUNCHER_USER_ID=$BUILD_USER_ID
        block: true
        block-thresholds:
          build-step-failure-threshold: FAILURE
          unstable-threshold: UNSTABLE
          failure-threshold: FAILURE
    - shell: |
        whoami
        ls -l
        sudo find . \( -name "*.xml" -o -name "*.log" \) -delete || echo "sudo cleanup skipped"
        find . \( -name "*.xml" -o -name "*.log" \) -delete || echo "cleanup skipped"
    - copyartifact:
        project: percona-server-{ps_version}-pipeline-dynamic
        which-build: specific-build
        build-number: "${{TRIGGERED_BUILD_NUMBERS_percona_server_{ps_version_no_dot}_pipeline_dynamic}}"
        do-not-fingerprint: true
    - shell: |
        echo "${{TRIGGERED_BUILD_NUMBERS_percona_server_{ps_version_no_dot}_pipeline_dynamic}}" > PIPELINE_BUILD_NUMBER
        gunzip build.log.gz
    publishers:
    - archive:
        artifacts: 'PIPELINE_BUILD_NUMBER'

- project:
    name: param-dynamic-28.4
    ps_version: 28.4
    ps_version_no_dot: '28_4'
    branch_name: release-26.7.0-1
    scripts_repo: https://github.com/Percona-Lab/ps-build
    scripts_branch: 8.0
    docker_os_list:
      - oraclelinux:8
      - oraclelinux:9
      - oraclelinux:10
      - ubuntu:jammy
      - ubuntu:noble
      - ubuntu:resolute
      - debian:bookworm
      - debian:trixie
    jobs:
      - percona-server-{ps_version}-param-dynamic
